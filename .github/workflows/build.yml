name: Windows build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build SVG icons, plugin and run tests
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Package installer
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TS3-SoundBridge-win64
          path: |
            dist/*.ts3_plugin
            dist/SHA256SUMS.txt
          if-no-files-found: error
